name: Publish BloomCircuit v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.0.0.yml"
      - "RELEASE_NOTES_v1.0.0.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BloomCircuit
        uses: actions/checkout@v4

      - name: Publish or update v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release edit v1.0.0 \
              --title "BloomCircuit v1.0.0" \
              --notes-file RELEASE_NOTES_v1.0.0.md
          else
            gh release create v1.0.0 \
              --target "$GITHUB_SHA" \
              --title "BloomCircuit v1.0.0" \
              --notes-file RELEASE_NOTES_v1.0.0.md
          fi
