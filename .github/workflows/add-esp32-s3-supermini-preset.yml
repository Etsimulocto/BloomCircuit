name: Add ESP32-S3 SuperMini preset

on:
  push:
    branches:
      - feat/esp32-s3-supermini-preset

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/esp32-s3-supermini-preset
      - name: Apply preset patch
        run: python3 tools/add_esp32_s3_supermini_preset.py
      - name: Verify JavaScript
        run: node --check components.js
      - name: Verify preset
        run: |
          grep -q 'esp32s3_supermini_hw747' components.js
          grep -q 'B+ LiPo' components.js
          grep -q 'GPIO48' components.js
      - name: Commit preset
        run: |
          git rm .github/workflows/add-esp32-s3-supermini-preset.yml tools/add_esp32_s3_supermini_preset.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.js
          git commit -m "feat: add ESP32-S3 SuperMini HW-747 preset"
          git push origin HEAD:feat/esp32-s3-supermini-preset
