name: Verify BloomCircuit v0.6 electrical boards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BloomCircuit
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Verify v0.6 electrical-board markers
        run: |
          grep -q 'version:5' app.js
          grep -q 'function boardElectricalGroup' app.js
          grep -q 'function handleBoardNodeClick' app.js
          grep -q 'function endpointWorld' app.js
          grep -q 'function wireLaneOffset' app.js
          grep -q 'board-node' styles.css
          grep -q 'v0.6 electrical boards' README.md
