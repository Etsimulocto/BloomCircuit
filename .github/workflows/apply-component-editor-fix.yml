name: Apply component editor fix

on:
  push:
    branches:
      - fix/editable-readable-components

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editable-readable-components
      - name: Apply patch
        run: python3 tools/apply_component_editor_fix.py
      - name: Verify JavaScript
        run: node --check app.js
      - name: Verify editor controls
        run: |
          grep -q 'id="componentTitle"' index.html
          grep -q 'componentPinLabels.addEventListener' app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-component-editor-fix.yml tools/apply_component_editor_fix.py .github/component-fix-trigger.txt
          git add app.js index.html
          git commit -m "fix: make placed components editable and labels readable"
          git push origin HEAD:fix/editable-readable-components
